name: build-livespeed-overlay

on:
  push:
  workflow_dispatch:

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build (MSVC)
        shell: cmd
        run: |
          cd src
          cl /nologo /LD /O2 /MT /std:c++17 /EHsc /DNDEBUG LiveSpeedOverlay.cpp /Fe:livespeed_overlay.dll /link user32.lib ole32.lib windowscodecs.lib uuid.lib d3d11.lib dxgi.lib
          cd ..
          copy /Y src\livespeed_overlay.dll SiderAddons\modules\LiveSpeedOverlay\livespeed_overlay.dll
      - uses: actions/upload-artifact@v4
        with:
          name: LiveSpeedOverlay_MSVC_siap_copy
          path: SiderAddons

  mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Build (mingw-w64)
        run: |
          cd src
          g++ -shared -O2 -std=c++17 -static -static-libgcc -static-libstdc++ LiveSpeedOverlay.cpp -o livespeed_overlay.dll -ld3d11 -ldxgi -lole32 -lwindowscodecs -luuid -luser32
          cd ..
          cp src/livespeed_overlay.dll SiderAddons/modules/LiveSpeedOverlay/livespeed_overlay.dll
      - uses: actions/upload-artifact@v4
        with:
          name: LiveSpeedOverlay_MinGW_siap_copy
          path: SiderAddons
